name: Probe portable Transkun on Windows
on:
  push:
    branches:
      - codex/windows-runtime
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install isolated Python
        shell: pwsh
        run: uv python install 3.11 --install-dir runtime
      - name: Install Transkun and smoke-test imports
        shell: pwsh
        run: |
          $py = @(Get-ChildItem runtime -Filter python.exe -Recurse)[0].FullName
          Write-Host "Python executable: $py"
          uv pip install --python "$py" "transkun==2.0.1" "setuptools<81"
          & $py -c "import transkun.transcribe, torch, pretty_midi; print(torch.__version__)"
