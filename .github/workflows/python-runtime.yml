name: Probe portable Transkun on Windows
on:
  push:
    branches:
      - codex/windows-runtime
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install isolated Python
        shell: pwsh
        run: uv python install 3.11 --install-dir runtime
      - name: Install Transkun and smoke-test imports
        shell: pwsh
        run: |
          $py = @(Get-ChildItem runtime -Filter python.exe -Recurse)[0].FullName
          Write-Host "Python executable: $py"
          uv pip install --python "$py" --break-system-packages "transkun==2.0.1" "setuptools<81" "miniaudio"
          & $py -c "import transkun.transcribe, torch, pretty_midi; print(torch.__version__)"
      - name: Transcribe a short WAV without system Python or ffmpeg
        shell: pwsh
        run: |
          $py = @(Get-ChildItem runtime -Filter python.exe -Recurse)[0].FullName
          $env:PYTHONPATH = "$pwd\python"
          & $py -c "import math,struct,wave; w=wave.open('probe.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<h',int(5000*math.sin(2*math.pi*440*i/44100))) for i in range(88200))); w.close()"
          & $py -c "from transkun_runner import run_transkun; run_transkun('probe.wav','probe.mid')"
          if (!(Test-Path probe.mid)) { throw 'MIDI output missing' }
