# Manually build a Windows installer without creating a public release.
name: Windows installer (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-build
      - codex/windows-runtime
      - codex/windows-audio-fix

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Bundle isolated Python and Transkun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv python install 3.11 --install-dir .runtime-build
          if ($LASTEXITCODE -ne 0) { throw 'Python download failed' }
          $py = @(Get-ChildItem .runtime-build -Filter python.exe -Recurse)[0].FullName
          uv pip install --python "$py" --break-system-packages -r python/requirements-win.txt
          if ($LASTEXITCODE -ne 0) { throw 'Transkun installation failed' }
          $target = Join-Path $pwd 'app/src-tauri/runtime'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path (Split-Path $py) '*') -Destination $target -Recurse -Force
          & (Join-Path $target 'python.exe') -c "import transkun.transcribe, miniaudio, torch; print(torch.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python import failed' }
      - name: Smoke-test audio to MIDI with bundled runtime
        shell: pwsh
        run: |
          $py = Join-Path $pwd 'app/src-tauri/runtime/python.exe'
          & $py -c "import math,struct,wave; w=wave.open('probe.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<h',int(5000*math.sin(2*math.pi*440*i/44100))) for i in range(88200))); w.close()"
          & $py python/pipeline.py probe.wav --solo-piano
          if ($LASTEXITCODE -ne 0 -or !(Test-Path probe.perf.mid)) { throw 'Transcription smoke test failed' }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build Windows NSIS installer
        working-directory: app
        run: npm run tauri -- build --bundles nsis
      - name: Check installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'app/src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -eq 0) { throw 'NSIS installer not found' }
          $installers | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List }
      - uses: actions/upload-artifact@v4
        with:
          name: muse-0.1.1-windows-audio-fix
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
