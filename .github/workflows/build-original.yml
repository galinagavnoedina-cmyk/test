name: Build unmodified Muse 0.1.1 on Windows

on:
  push:
    branches:
      - codex/muse-original-windows
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out original Muse 0.1.1 source
        uses: actions/checkout@v4
        with:
          repository: mqtik/muse
          ref: 2d436b0e323304d4118c8ae0b245a968e3e0834b
          path: source
          persist-credentials: false

      - name: Verify original source commit
        shell: pwsh
        run: |
          $actual = git -C source rev-parse HEAD
          if ($actual -ne '2d436b0e323304d4118c8ae0b245a968e3e0834b') {
            throw "Unexpected source commit: $actual"
          }
          Write-Host "Building unchanged Muse source at $actual"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: source/app
        run: npm ci

      - name: Build original Windows installer
        working-directory: source/app
        run: npm run tauri -- build --bundles nsis

      - name: Show installer hash
        shell: pwsh
        run: Get-FileHash source/app/src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: muse-0.1.1-original-windows
          path: source/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
